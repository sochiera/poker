[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-poker"
version = "1.1.0"
description = "Realtime Planning Poker with shared Redis state"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.setuptools]
packages = ["planning_poker"]

[tool.setuptools.package-data]
planning_poker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
